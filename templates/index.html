<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatPDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #141A26;
    --ink-soft: #566074;
    --paper: #FFFFFF;
    --desk: #EDF0F4;
    --line: #D9DEE6;
    --mark: #FFE066;
    --mark-soft: #FFF6CC;
    --danger: #B42318;
    --display: "Bricolage Grotesque", "IBM Plex Sans Arabic", system-ui, sans-serif;
    --body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--desk); color: var(--ink);
    font-family: var(--body); font-size: 15.5px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 340px 1fr; height: 100dvh; }

  /* ---------- Side panel ---------- */
  .side {
    background: var(--paper); border-inline-end: 1px solid var(--line);
    padding: 28px 24px; display: flex; flex-direction: column; gap: 28px; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
  .page-icon {
    width: 34px; height: 42px; border: 2px solid var(--ink); border-radius: 5px; background: var(--paper);
    position: relative; flex: none;
  }
  .page-icon::before {
    content: ""; position: absolute; inset: 9px 5px auto 5px; height: 9px; background: var(--mark); border-radius: 2px;
  }
  .page-icon::after {
    content: ""; position: absolute; inset: 24px 5px auto 5px; height: 2px; background: var(--ink);
    box-shadow: 0 6px 0 var(--ink); border-radius: 2px;
  }
  .side h2 { font-family: var(--display); font-size: 26px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.015em; }
  .side p { margin: 0; color: var(--ink-soft); font-size: 14.5px; }

  .drop {
    border: 1.5px dashed #aab3c2; border-radius: 16px; padding: 28px 18px; text-align: center;
    background: var(--paper); transition: background .15s, border-color .15s; cursor: pointer; display: block; width: 100%;
  }
  .drop:hover, .drop.drag { border-color: var(--ink); background: var(--mark-soft); }
  .drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
  .drop span { color: var(--ink-soft); font-size: 13.5px; }
  .drop svg { width: 30px; height: 30px; margin-bottom: 10px; }
  .drop[disabled] { pointer-events: none; opacity: .7; }
  .error { color: var(--danger); font-size: 14px; margin-top: 10px; }

  .spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .doc { border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; }
  .doc .page-icon { width: 40px; height: 50px; }
  .doc .page-icon::before { inset: 11px 6px auto 6px; }
  .doc .page-icon::after { inset: 28px 6px auto 6px; }
  .doc-name { font-weight: 600; word-break: break-word; line-height: 1.35; }
  .doc-meta { color: var(--ink-soft); font-size: 13.5px; margin-top: 2px; }
  .link-btn { background: none; border: 0; padding: 0; margin-top: 10px; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; font-size: 14px; }
  .hidden { display: none !important; }

  .note { font-size: 13px; color: var(--ink-soft); margin-top: auto; }

  /* ---------- Chat ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; height: 100dvh; }
  .scroll { flex: 1; overflow-y: auto; padding: 32px 24px 12px; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }

  .empty { margin: auto 0; padding: 40px 0; }
  .empty h1 { font-family: var(--display); font-size: clamp(30px, 5vw, 46px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 12px; }
  .empty p { color: var(--ink-soft); max-width: 46ch; margin: 0 0 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; transition: background .12s, border-color .12s; }
  .chip:hover { background: var(--mark); border-color: var(--ink); }

  .msg { max-width: 88%; padding: 11px 15px; border-radius: 16px; overflow-wrap: anywhere; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 6px 0; padding-inline-start: 22px; } .msg li { margin: 3px 0; }
  .msg code { background: var(--desk); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  .msg.user { align-self: flex-end; background: var(--ink); color: #fff; border-end-end-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-end-start-radius: 4px; }
  .msg.err { align-self: flex-start; background: #FEF3F2; border: 1px solid #FECDCA; color: var(--danger); }

  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing i { width: 7px; height: 7px; background: var(--ink-soft); border-radius: 50%; animation: bounce 1.1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }

  details.sources { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13.5px; }
  details.sources summary { cursor: pointer; font-weight: 500; color: var(--ink-soft); }
  .excerpt { margin-top: 8px; padding: 10px 12px; background: var(--desk); border-radius: 10px; color: #2b3445; white-space: pre-wrap; max-height: 170px; overflow-y: auto; }
  mark { background: var(--mark); color: var(--ink); border-radius: 3px; padding: 0 2px; }

  /* ---------- Composer ---------- */
  .composer-wrap { padding: 8px 24px 22px; }
  .composer {
    max-width: 760px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px; transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(20, 26, 38, .08); }
  .composer textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; font: inherit; color: inherit;
    max-height: 160px; padding: 8px 0; line-height: 1.5;
  }
  .composer textarea::placeholder { color: #8a93a4; }
  .send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; transition: transform .1s, opacity .15s; }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .28; cursor: not-allowed; }
  .send svg { width: 20px; height: 20px; }
  [dir="rtl"] .send svg { transform: scaleX(-1); }

  /* ---------- Mobile ---------- */
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .side { border-inline-end: 0; border-bottom: 1px solid var(--line); padding: 16px; gap: 14px; overflow: visible; }
    .side h2, .side > div > p, .note { display: none; }
    .drop { padding: 14px; } .drop svg { display: none; } .drop strong { margin: 0; }
    .main { height: auto; min-height: 0; overflow: hidden; }
    .scroll { padding: 20px 14px 8px; }
    .composer-wrap { padding: 8px 14px 14px; }
    .msg { max-width: 94%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand"><span class="page-icon" aria-hidden="true"></span>ChatPDF</div>

    <div>
      <h2>Ask your PDF</h2>
      <p>Add a document, then ask questions in Arabic or English. Answers come from the pages you uploaded.</p>
    </div>

    <div id="uploadArea">
      <button class="drop" id="drop" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <strong id="dropTitle">Choose a PDF</strong>
        <span id="dropHint">or drop it here (up to 20 MB)</span>
      </button>
      <input type="file" id="file" accept="application/pdf" hidden>
      <div class="error" id="uploadError" role="alert"></div>
    </div>

    <div class="doc hidden" id="doc">
      <span class="page-icon" aria-hidden="true"></span>
      <div>
        <div class="doc-name" id="docName"></div>
        <div class="doc-meta" id="docMeta"></div>
        <button class="link-btn" id="changeDoc" type="button">Use another PDF</button>
      </div>
    </div>

    <p class="note">Scanned PDFs without selectable text can't be read yet.</p>
  </aside>

  <main class="main">
    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="question" rows="1" dir="auto" placeholder="Add a PDF to start asking" aria-label="Your question" disabled></textarea>
        <button class="send" id="send" type="submit" aria-label="Send question" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg>
        </button>
      </form>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const thread = $("thread"), scrollBox = $("scroll"), input = $("question"), sendBtn = $("send");
let docId = null, busy = false;

/* ---------- helpers ---------- */
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function inline(s) { return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>"); }

function markdown(text) {
  let html = "", inList = false;
  for (const line of esc(text).split("\n")) {
    const m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(m[1])}</li>`; }
    else { if (inList) { html += "</ul>"; inList = false; } if (line.trim()) html += `<p>${inline(line)}</p>`; }
  }
  return html + (inList ? "</ul>" : "");
}

function highlight(text, question) {
  const terms = [...new Set((question.toLowerCase().match(/[\p{L}\p{N}]{3,}/gu) || []))];
  let html = esc(text);
  if (!terms.length) return html;
  const re = new RegExp("(" + terms.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "giu");
  return html.replace(re, "<mark>$1</mark>");
}

function toBottom() { scrollBox.scrollTo({ top: scrollBox.scrollHeight, behavior: "smooth" }); }

function addMsg(kind, html) {
  clearEmpty();
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.dir = "auto";
  div.innerHTML = html;
  thread.appendChild(div);
  toBottom();
  return div;
}

/* ---------- empty state ---------- */
const SUGGESTIONS = ["What is this document about?", "What are the key points?", "ما هي النقاط الرئيسية؟"];

function renderEmpty() {
  thread.innerHTML = "";
  const box = document.createElement("div");
  box.className = "empty"; box.id = "empty";
  if (!docId) {
    box.innerHTML = `<h1>Your PDF,<br>one question away.</h1><p>Add a document on the left. Then ask what it says, where a topic appears, or for a summary.</p>`;
  } else {
    box.innerHTML = `<h1>Ready. What do you want to know?</h1><p>Try one of these, or write your own question.</p><div class="chips"></div>`;
    const chips = box.querySelector(".chips");
    SUGGESTIONS.forEach(s => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = s; b.dir = "auto";
      b.onclick = () => ask(s);
      chips.appendChild(b);
    });
  }
  thread.appendChild(box);
}
function clearEmpty() { const e = $("empty"); if (e) e.remove(); }

/* ---------- upload ---------- */
const drop = $("drop"), fileInput = $("file");

function setUploading(on, name = "") {
  drop.disabled = on; drop.toggleAttribute("disabled", on);
  if (on) drop.innerHTML = `<div class="spinner"></div><strong>Reading ${esc(name)}</strong><span>This takes a few seconds</span>`;
}

function resetDrop() {
  drop.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><strong>Choose a PDF</strong><span>or drop it here (up to 20 MB)</span>`;
}

async function upload(file) {
  $("uploadError").textContent = "";
  if (!file) return;
  if (!file.name.toLowerCase().endsWith(".pdf")) { $("uploadError").textContent = "That is not a PDF. Choose a file ending in .pdf."; return; }
  setUploading(true, file.name);
  try {
    const body = new FormData(); body.append("file", file);
    const res = await fetch("/upload", { method: "POST", body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Upload failed.");
    docId = data.doc_id;
    $("docName").textContent = data.filename;
    $("docMeta").textContent = `${data.pages} page${data.pages === 1 ? "" : "s"} · ${data.chars.toLocaleString()} characters`;
    $("uploadArea").classList.add("hidden");
    $("doc").classList.remove("hidden");
    input.disabled = false; sendBtn.disabled = false;
    input.placeholder = "Ask a question about this PDF";
    renderEmpty();
    input.focus();
  } catch (e) {
    $("uploadError").textContent = e.message;
  } finally {
    setUploading(false); resetDrop(); fileInput.value = "";
  }
}

drop.onclick = () => fileInput.click();
fileInput.onchange = () => upload(fileInput.files[0]);
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => upload(e.dataTransfer.files[0]));

$("changeDoc").onclick = () => {
  docId = null;
  $("doc").classList.add("hidden"); $("uploadArea").classList.remove("hidden");
  input.disabled = true; sendBtn.disabled = true; input.value = ""; resize();
  input.placeholder = "Add a PDF to start asking";
  renderEmpty();
};

/* ---------- chat ---------- */
async function ask(question) {
  if (busy || !docId || !question.trim()) return;
  busy = true; sendBtn.disabled = true;
  addMsg("user", esc(question).replace(/\n/g, "<br>"));
  const wait = addMsg("bot", `<span class="typing" aria-label="Thinking"><i></i><i></i><i></i></span>`);
  try {
    const res = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ doc_id: docId, question }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    let html = markdown(data.answer || "");
    if (data.sources && data.sources.length) {
      html += `<details class="sources"><summary>Passages used (${data.sources.length})</summary>` +
        data.sources.map(s => `<div class="excerpt" dir="auto">${highlight(s, question)}</div>`).join("") + `</details>`;
    }
    wait.innerHTML = html;
  } catch (e) {
    wait.className = "msg err"; wait.textContent = e.message;
  } finally {
    busy = false; sendBtn.disabled = false; toBottom(); input.focus();
  }
}

$("form").onsubmit = e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = ""; resize();
  ask(q);
};
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", resize);

renderEmpty();
</script>
</body>
</html>
